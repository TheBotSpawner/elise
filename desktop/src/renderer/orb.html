<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ELISE</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        --eye: 24vh;
      }
      canvas {
        display: block;
        position: absolute;
        right: 0;
        top: 0;
        width: 100vh;
        height: 100vh;
        opacity: 0;
        transform: scale(0.4);
      }
      /* It pops in when a conversation starts: noticed, then quiet. */
      canvas.in {
        opacity: 1;
        transform: scale(1);
        transition:
          transform 0.45s cubic-bezier(0.2, 1.6, 0.4, 1),
          opacity 0.2s ease-out;
        cursor: pointer;
      }
      canvas.in:hover {
        cursor: pointer;
        transform: scale(1.08);
      }
      /* Tapped: it shrinks away as the conversation ends. */
      canvas.in.out {
        opacity: 0;
        transform: scale(0.6);
      }
      /* The eye: subtle, on the orb's left edge; a tap brings ELISE to the front. */
      #eye {
        position: absolute;
        left: 0;
        top: calc(50% - var(--eye) / 2);
        width: var(--eye);
        height: var(--eye);
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid rgb(94 234 212 / 0.25);
        border-radius: 50%;
        background: rgb(6 14 18 / 0.85);
        color: rgb(153 246 228);
        cursor: pointer;
        opacity: 0;
        transform: scale(0.4);
        pointer-events: none;
      }
      #eye svg {
        width: 58%;
        height: 58%;
      }
      body.in #eye {
        opacity: 0.6;
        transform: scale(1);
        pointer-events: auto;
        transition:
          transform 0.45s 0.1s cubic-bezier(0.2, 1.6, 0.4, 1),
          opacity 0.2s 0.1s ease-out;
      }
      body.in #eye:hover {
        opacity: 1;
      }
      body.in.out #eye {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        canvas,
        #eye {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <button id="eye" type="button" aria-label="Abrir ELISE" title="Abrir ELISE">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <script type="module" src="./orb-widget.ts"></script>
  </body>
</html>
