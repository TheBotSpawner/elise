<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ELISE</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0;
        transform: scale(0.4);
      }
      /* It pops in when a conversation starts: noticed, then quiet. */
      canvas.in {
        opacity: 1;
        transform: scale(1);
        transition:
          transform 0.45s cubic-bezier(0.2, 1.6, 0.4, 1),
          opacity 0.2s ease-out;
        cursor: pointer;
      }
      canvas.in:hover {
        cursor: pointer;
        transform: scale(1.08);
      }
      /* Tapped: it shrinks away as the conversation ends. */
      canvas.in.out {
        opacity: 0;
        transform: scale(0.6);
      }
      @media (prefers-reduced-motion: reduce) {
        canvas {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module" src="./orb-widget.ts"></script>
  </body>
</html>
