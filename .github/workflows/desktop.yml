name: ELISE Desktop

# ADR-081/082/084. PRs: compile and type-check Desktop (cheap). main: package, build the real
# Windows installer and smoke-test both. Tags desktop-v<semver> (e.g. desktop-v0.1.0-beta.1):
# build the installer with the production Cloud, smoke-test it, then publish it with
# desktop/scripts/publish-release.mjs — versioned release, verified download, the channel's
# update feed, and the channel manifest LAST. Pre-release versions go to beta; plain versions
# to stable (signed only). The manifest URLs never change:
#   https://github.com/<owner>/<repo>/releases/download/desktop-{channel}/desktop-releases.json
# "Run workflow" withdraws a version (its channel goes back to the previous good one).
on:
  pull_request:
    paths: ["desktop/**", "home-hub/**", "src/core/platform/**", "src/app/api/desktop/**"]
  push:
    branches: [main]
    paths: ["desktop/**", "home-hub/**", "src/core/platform/**", "src/app/api/desktop/**"]
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      withdraw:
        description: "Withdraw this Desktop version from downloads (e.g. 0.1.0-beta.2)"
        required: true
      channel:
        description: "Its channel"
        type: choice
        options: [beta, stable]
        default: beta

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Desktop · types · renderer build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run typecheck:desktop
      # The renderer is the shared web source compiled for Desktop: server-only code fails here.
      - run: npx vite build -c vite.renderer.config.ts
        working-directory: desktop
        env:
          ELISE_CLOUD_URL: https://cloud.example.invalid

  package-smoke:
    name: Desktop · package + smoke (Windows)
    if: github.event_name == 'push'
    needs: compile
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npx playwright install chromium
      # Unreachable cloud on purpose: the app must boot from its own assets.
      - run: npm run package:desktop
        env:
          ELISE_CLOUD_URL: https://cloud.example.invalid
      - run: npm run smoke:desktop -- desktop/out/ELISE-win32-x64/elise.exe
      # The real installer: per-user install, elise://, uninstall entry, launch, Home check.
      - run: npm run make:desktop -- --targets @electron-forge/maker-squirrel
        env:
          ELISE_CLOUD_URL: https://cloud.example.invalid
      - shell: bash
        run: node desktop/scripts/installer-smoke.mjs "$(ls desktop/out/make/squirrel.windows/x64/*Setup*.exe)"

  # Published from the owner's computer (publish-release.mjs creates the tag): one binary per
  # version, so CI never rebuilds and re-uploads over it.
  published:
    name: Desktop · already published?
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: check
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx "ELISE-Setup-$v.exe"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "desktop-v$v already has its installer: nothing to publish."
          fi

  release:
    name: Desktop · publish (Windows)
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') &&
      needs.published.outputs.skip != 'true'
    needs: [compile, published]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Public build configuration (Actions → Variables): baked into the installer.
      ELISE_CLOUD_URL: ${{ vars.ELISE_CLOUD_URL }}
      ELISE_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing (Actions → Secrets), only for stable. Without it: unsigned, beta only.
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npx playwright install chromium
      - name: Version, tag and channel agree
        id: meta
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          test "desktop-v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ desktop-v$v"; exit 1; }
          channel=$([[ "$v" == *-* ]] && echo beta || echo stable)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "ELISE_DESKTOP_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Windows certificate
        if: env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: bash
        run: |
          echo "${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERTIFICATE_FILE=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
      # Fails here if ELISE_CLOUD_URL is missing or local (desktop/cloud-url.ts).
      - run: npm run make:desktop -- --targets @electron-forge/maker-squirrel
      - name: Installer smoke test (install → launch → uninstall)
        shell: bash
        run: node desktop/scripts/installer-smoke.mjs "$(ls desktop/out/make/squirrel.windows/x64/*Setup*.exe)"
      - name: Publish (manifest last)
        shell: bash
        run: |
          signed=$([ -n "$WINDOWS_CERTIFICATE_PASSWORD" ] && echo --signed || true)
          node desktop/scripts/publish-release.mjs --channel "${{ steps.meta.outputs.channel }}" $signed

  withdraw:
    name: Desktop · withdraw a version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: node desktop/scripts/publish-release.mjs --channel "${{ inputs.channel }}" --withdraw "${{ inputs.withdraw }}"
